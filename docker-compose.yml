version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "9090:9090"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9090"]
    volumes:
      - ./backend:/app/backend
      - ./agent:/app/agent
      - results_data:/app/results
      - db_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=sqlite:////app/data/valido.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:9090/healthz'); print(r.read())\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 512m

  worker:
    build: ./backend
    depends_on:
      - redis
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_TASK_ACKS_LATE=1
      - CELERY_WORKER_PREFETCH_MULTIPLIER=1
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=200
    command: ["celery", "-A", "backend.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-4}"]
    volumes:
      - ./backend:/app/backend
      - results_data:/app/results
    restart: unless-stopped
    mem_limit: 1024m

volumes:
  results_data:
    driver: local
  db_data:
    driver: local
