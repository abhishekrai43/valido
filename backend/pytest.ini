[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Coverage options (when using pytest-cov)
# Uncomment to enable coverage:
# --cov=app
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=85

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require services)
    performance: Performance and load tests (very slow)
    critical: Critical path tests (must pass for release)
    
# Test discovery
norecursedirs = .git .tox dist build *.egg __pycache__

# Timeout (requires pytest-timeout)
# timeout = 300

# Parallel execution (requires pytest-xdist)
# -n auto
